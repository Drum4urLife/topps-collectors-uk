name: Test Topps release reader

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-releases:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Read Topps release calendar
        run: python src/releases.py
